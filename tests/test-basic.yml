name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build
          install-script: npm install
          compression: gzip
          show-total: 'true'
          collapse-unchanged: 'true'
          minimum-change-threshold: 1
          pattern: '**/dist/**/*.js'
          exclude: '{**/*.map,**/node_modules/**}'
      - name: Assert action ran (may fail due to no PR context)
        run: |
          echo "Action completed (with or without error in non-PR context)"
          echo "PASS"
