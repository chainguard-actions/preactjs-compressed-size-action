name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          build-script: build
          compression: gzip
          pattern: "**/*.js"
          exclude: "**/*.map"
          show-total: "true"
          collapse-unchanged: "true"
          omit-unchanged: "false"
          minimum-change-threshold: 1
          sort-by: "Filename:asc"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may fail due to no build artifacts, which is expected in test env)"
          echo "PASS"
