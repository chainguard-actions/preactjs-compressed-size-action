name: Test base-ref input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          base-ref: main
          pattern: '**/*.js'
          build-script: 'build'
        continue-on-error: true
      - name: Assert action ran (base-ref input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_BODY: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-body: $COMMENT_BODY"
          # The action may fail because there's no PR and no build output,
          # but it must not fail due to an unrecognized input.
          # We accept both success and failure outcomes (not 'skipped').
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: base-ref input was accepted and action ran"
