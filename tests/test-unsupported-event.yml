name: Test unsupported event fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal npm project
        run: |
          mkdir -p /tmp/sample-project/dist
          cat > /tmp/sample-project/package.json <<'EOF'
          {
            "name": "sample-project",
            "version": "1.0.0",
            "scripts": {
              "build": "mkdir -p dist && printf 'console.log(\"hello\");' > dist/bundle.js"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
        with:
          repo-token: fake-token
          build-script: build
          pattern: "**/dist/**/*.js"
          install-script: "echo 'no install needed'"
          cwd: /tmp/sample-project

      - name: Assert action failed for unsupported event
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event 'workflow_dispatch'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported event"
