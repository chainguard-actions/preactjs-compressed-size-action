name: Test unsupported event error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action only supports push, pull_request, and pull_request_target events.
      # Under act with workflow_dispatch, it must fail with a clear error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event (workflow_dispatch), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported event type"
