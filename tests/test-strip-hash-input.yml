name: Test strip-hash input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that strip-hash regex input is accepted by the action.
      # The action uses stripHash() to remove content hashes from filenames
      # (e.g. "main.abc123.js" -> "main.*.js").
      # The action will fail on unsupported event, but the strip-hash input
      # should be parsed without error.
      - id: action-strip-hash
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build
          strip-hash: '\.[a-f0-9]{8}\.'
          pattern: '**/dist/**/*.{js,mjs,cjs}'

      - name: Assert action fails on unsupported event (strip-hash input accepted)
        env:
          OUTCOME: ${{ steps.action-strip-hash.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: strip-hash input accepted, action failed on unsupported event as expected"

      # Test with strip-hash using capture groups (submatches become asterisks)
      - id: action-strip-hash-groups
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build
          strip-hash: '\-([a-f0-9]{8})\.'
          pattern: '**/dist/**/*.{js,mjs,cjs}'

      - name: Assert action fails on unsupported event (strip-hash with groups accepted)
        env:
          OUTCOME: ${{ steps.action-strip-hash-groups.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: strip-hash with capture groups accepted, action failed on unsupported event as expected"
