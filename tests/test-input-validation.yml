name: Test input validation and defaults
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts all valid inputs without crashing on input parsing.
      # The action will still fail because workflow_dispatch is unsupported, but the
      # failure should be specifically about the event type, not about bad inputs.
      - id: action-with-inputs
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build
          compression: gzip
          show-total: 'true'
          collapse-unchanged: 'true'
          omit-unchanged: 'false'
          minimum-change-threshold: '1'
          sort-by: 'Filename:asc'
          pattern: '**/dist/**/*.{js,mjs,cjs}'
          exclude: '{**/*.map,**/node_modules/**}'

      - name: Assert action failed due to unsupported event (not bad inputs)
        env:
          OUTCOME: ${{ steps.action-with-inputs.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event (workflow_dispatch), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed — inputs were accepted, failure is due to unsupported event type"

      # Test with brotli compression input
      - id: action-brotli
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build
          compression: brotli
          show-total: 'false'
          collapse-unchanged: 'false'
          sort-by: 'Size:desc'

      - name: Assert brotli variant also fails on unsupported event
        env:
          OUTCOME: ${{ steps.action-brotli.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event (workflow_dispatch), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: brotli compression variant correctly failed due to unsupported event type"
