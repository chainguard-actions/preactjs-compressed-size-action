name: Test unsupported event error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action only supports pull_request, pull_request_target, and push events.
      # Under act with workflow_dispatch, context.eventName is always "workflow_dispatch",
      # so the action will throw an "Unsupported eventName" error. We verify it fails
      # gracefully with the correct error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported event type"
