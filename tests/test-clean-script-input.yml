name: Test clean-script input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up minimal package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "scripts": {
              "build": "echo 'build done'",
              "clean": "echo 'clean done'"
            }
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build
          clean-script: clean
          pattern: "*.js"
      - name: Assert action ran with clean-script input accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because this is not a PR event, but it must not
          # fail due to an unrecognized input. Any outcome (success or failure)
          # is acceptable as long as the action was invoked.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted clean-script input and ran"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
