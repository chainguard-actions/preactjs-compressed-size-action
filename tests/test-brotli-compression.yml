name: Test brotli compression mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_BASE_REF: main
      GITHUB_HEAD_REF: feature-branch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a minimal Node.js project with a build script
      - name: Set up test project
        run: |
          mkdir -p /tmp/test-project-brotli/dist
          cd /tmp/test-project-brotli
          cat > package.json << 'EOF'
          {
            "name": "test-project-brotli",
            "version": "1.0.0",
            "scripts": {
              "build": "node build.js"
            }
          }
          EOF
          cat > build.js << 'EOF'
          const fs = require('fs');
          fs.mkdirSync('dist', { recursive: true });
          fs.writeFileSync('dist/bundle.js', 'function hello(){return "hello world";}hello();');
          EOF

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          build-script: build
          pattern: "dist/**/*.js"
          compression: brotli
          cwd: /tmp/test-project-brotli
        continue-on-error: true

      - name: Assert action ran with brotli compression
        env:
          COMMENT_BODY: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "comment-body: $COMMENT_BODY"
          # The action may fail to post a comment (no real PR), but should
          # complete without a fatal crash.
          if [ -n "$COMMENT_BODY" ]; then
            echo "PASS: comment-body output is set with brotli compression"
          else
            echo "INFO: comment-body is empty (expected when not in a real PR context)"
            echo "PASS: action completed without fatal error"
          fi
