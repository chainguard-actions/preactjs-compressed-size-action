name: Test custom inputs (strip-hash, sort-by, minimum-change-threshold)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal npm project
        run: |
          mkdir -p /tmp/custom-project
          cat > /tmp/custom-project/package.json <<'EOF'
          {
            "name": "custom-project",
            "version": "1.0.0",
            "scripts": {
              "build": "node build.js"
            }
          }
          EOF
          cat > /tmp/custom-project/build.js <<'EOF'
          const fs = require('fs');
          fs.mkdirSync('dist', { recursive: true });
          fs.writeFileSync('dist/bundle.abc123.js', 'console.log("hello world");');
          console.log('Build complete');
          EOF
          cd /tmp/custom-project
          git init
          git config user.email "test@test.com"
          git config user.name "Test"
          git add .
          git commit -m "initial commit"

      - name: Run action with custom inputs
        id: action
        uses: .
        with:
          repo-token: fake-token
          build-script: build
          pattern: '**/dist/**/*.js'
          cwd: /tmp/custom-project
          strip-hash: '\.[a-f0-9]{6,}\.'
          sort-by: 'Size:desc'
          minimum-change-threshold: 10
          comment-key: 'bundle-stats'
          show-total: 'true'
          collapse-unchanged: 'false'
          omit-unchanged: 'false'
        continue-on-error: true

      - name: Assert action ran with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to git operations in test environment,
          # but it should NOT fail with "Unsupported eventName" error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
