name: Test advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          clean-script: 'echo clean'
          comment-key: 'bundle-size-main'
          compression: brotli
          cwd: '.'
          install-script: 'npm install'
          omit-unchanged: 'true'
          strip-hash: '\.[a-f0-9]{8}\.'
          use-check: 'false'
          build-script: build
          pattern: '**/dist/**/*.js'
          exclude: '{**/*.map,**/node_modules/**}'
      - name: Assert action ran (may fail due to no PR context)
        run: |
          echo "Action completed (with or without error in non-PR context)"
          echo "PASS"
