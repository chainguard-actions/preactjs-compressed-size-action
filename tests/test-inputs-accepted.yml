name: Test action inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts all valid optional inputs without crashing on
      # input parsing. The action will still fail with "Unsupported eventName" since
      # workflow_dispatch is not supported, but it should NOT fail due to bad inputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build
          compression: gzip
          show-total: 'true'
          collapse-unchanged: 'true'
          omit-unchanged: 'false'
          strip-hash: '\.[a-f0-9]{8}\.'
          minimum-change-threshold: 1
          pattern: '**/dist/**/*.{js,mjs,cjs}'
          exclude: '{**/*.map,**/node_modules/**}'

      - name: Assert action failed with event error (not input error)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action must fail (unsupported event), not succeed
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed (inputs were accepted, event type was rejected)"
