name: Test custom options (unsupported event)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          compression: gzip
          show-total: 'true'
          collapse-unchanged: 'false'
          omit-unchanged: 'true'
          minimum-change-threshold: '100'
          sort-by: 'Size:desc'
          comment-key: 'bundle-a'
          strip-hash: '\.[a-f0-9]{8}\.'

      - name: Assert action failed with unsupported event error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail under workflow_dispatch event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed under unsupported event type with custom options"
