name: Test comment-key input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the comment-key input (used for multiple bundle
      # calculations in separate PR comments). The action will fail with "Unsupported
      # eventName" since workflow_dispatch is not a supported event, but it should
      # not fail due to the comment-key input itself.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          build-script: build
          comment-key: 'main-bundle'

      - name: Assert action failed with event error (not comment-key error)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed (comment-key input was accepted, event type was rejected)"
